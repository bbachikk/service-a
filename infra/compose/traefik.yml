# Traefik runs once per server, outside of any preview stack, and discovers
# preview containers through Docker labels. Deployed by bootstrap-server.sh.

services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --providers.docker=true
      # Containers must opt in with traefik.enable=true, so production
      # containers on another network are never picked up by accident.
      - --providers.docker.exposedbydefault=false
      # No global network here: each stack declares its own via the
      # traefik.docker.network label and deploy.sh attaches Traefik to it.
      - --entrypoints.web.address=:80
      - --entrypoints.traefik.address=:8080
      - --api.dashboard=true
      - --ping=true
      - --accesslog=true
      - --log.level=INFO
      # --- Real domain + Let's Encrypt: uncomment and set PREVIEW_ACME_EMAIL ---
      # - --entrypoints.websecure.address=:443
      # - --entrypoints.web.http.redirections.entrypoint.to=websecure
      # - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # - --certificatesresolvers.le.acme.email=${PREVIEW_ACME_EMAIL}
      # - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      # - --certificatesresolvers.le.acme.dnschallenge=true
      # - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
    ports:
      - "80:80"
      # - "443:443"
    environment:
      # - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      TZ: UTC
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks: [edge]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.${PREVIEW_DOMAIN}`)
      - traefik.http.routers.dashboard.entrypoints=web
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.middlewares=dashboard-auth
      # htpasswd hash generated by bootstrap-server.sh
      - traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}

networks:
  edge:
    name: preview_edge

volumes:
  letsencrypt:
